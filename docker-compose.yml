services:
  app:
    build: .
    image: jira-logwork
    container_name: jira-logwork
    restart: unless-stopped
    # 3847 is picked to stay clear of the usual 3000/5000/8080 dev ports.
    # Override with APP_PORT=xxxx docker compose up -d
    ports:
      - "${APP_PORT:-3847}:3847"
    env_file:
      - path: .env.local
        required: false
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    # Same folder `npm run dev` uses, so settings and history carry over.
    # Don't run both at once — they'd share one SQLite file.
    volumes:
      - ./data:/app/data
    mem_limit: 512m

  # Serves the app at http://logwork.localhost — no port to remember. Port 3847
  # above stays open too, so old bookmarks keep working.
  proxy:
    image: caddy:2-alpine
    container_name: jira-logwork-proxy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    mem_limit: 64m
